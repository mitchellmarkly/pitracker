server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /janice {
    return 301 /janice/;
  }

  location /janice/ {
    proxy_pass https://janice.e-351.com/;
    proxy_set_header Host janice.e-351.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}